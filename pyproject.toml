[project]
name = "trend-desk"
version = "0.1.0"
description = "Trend Desk: a fashion trend analyst agent (FastAPI + LiteLLM + Gemini) with Wikipedia, eBay and V&A tools"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
]
